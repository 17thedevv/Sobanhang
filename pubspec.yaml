name: sobanhang
description: Sổ Bán Hàng Clone - Quản lý bán hàng cho tạp hóa
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0 # Formatting currency and date

  # State Management
  provider: ^6.1.1 # Or riverpod, but provider is simple and standard for MVP

  # Utilities
  uuid: ^4.3.3 # Generating unique IDs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
