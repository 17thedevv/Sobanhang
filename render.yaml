services:
  - type: web
    name: sobanhang-api
    runtime: node
    rootDir: backend
    
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm start
    
    healthCheckPath: /health
    
    envVars:
      - key: NODE_ENV
        value: production
        
      # Các biến bảo mật sẽ điền trên Dashboard của Render, đặt sync: false để không lưu mã lên code
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
