services:
  - type: web
    name: sobanhang-api
    runtime: node
    rootDir: backend
    plan: free
    
    buildCommand: npm install --include=dev && npx prisma db push && npx prisma generate && npm run build
    startCommand: npm start
    
    healthCheckPath: /health
    
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: NODE_ENV
        value: production
        
      # Các biến bảo mật sẽ điền trên Dashboard của Render, đặt sync: false để không lưu mã lên code
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: web
    env: static
    name: sobanhang-frontend
    rootDir: web_app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
